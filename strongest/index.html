<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;background:radial-gradient(circle at 14% 0%,rgba(255,255,255,.95),transparent 29%),linear-gradient(180deg,#fff6db 0%,#fffdf8 55%,#f3eee4 100%);overflow-x:hidden}button,input{font:inherit}.shell{width:min(790px,100%);margin:0 auto;padding:18px 14px 54px;position:relative}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;position:relative;z-index:4}.brand{font-weight:1000;letter-spacing:.05em}.pill{font-size:12px;font-weight:900;padding:7px 11px;border-radius:999px;background:#fff;border:1.5px solid #e7dbc5}.card{position:relative;background:rgba(255,253,247,.97);border:1.5px solid #eadfc7;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.hero{padding:30px 22px 24px;text-align:center}.hero h1{font-size:clamp(34px,8vw,56px);line-height:1.08;margin:10px 0 10px;font-weight:1000;letter-spacing:.02em}.hero .sub{max-width:570px;margin:0 auto 20px;line-height:1.8;color:#6b6256;font-weight:750}.mascot-wrap{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin:20px auto 18px}.mascot{width:116px;height:94px;object-fit:cover;border:3px solid #292929;border-radius:24px;background:#fff;box-shadow:0 9px 0 #0001;transform:rotate(-2deg);flex:0 0 auto}.bubble{position:relative;max-width:380px;background:#fff;border:2px solid #292929;border-radius:20px;padding:12px 14px;text-align:left;font-weight:950;line-height:1.5}.bubble:before{content:"";position:absolute;left:-10px;bottom:18px;width:18px;height:18px;background:#fff;border-left:2px solid #292929;border-bottom:2px solid #292929;transform:rotate(45deg)}.namebox{max-width:470px;margin:18px auto 12px;text-align:left}.namebox label{display:block;font-size:13px;font-weight:950;margin:0 0 7px 4px}.namebox input{width:100%;padding:14px 15px;border:2px solid #d8cdbb;border-radius:16px;background:#fff;font-weight:850;outline:none}.namebox input:focus{border-color:#9b8662;box-shadow:0 0 0 4px rgba(213,166,42,.12)}.namehint{font-size:12px;color:#857a6b;margin:6px 4px 0}.cta,.secondary,.ghost{width:100%;border-radius:18px;padding:15px 17px;font-weight:1000;cursor:pointer}.cta{border:0;background:#292929;color:#fff;box-shadow:0 7px 0 #0002}.secondary{border:2px solid #292929;background:#fff;color:#292929}.ghost{border:0;background:transparent;color:#786f62;text-decoration:underline}.hidden{display:none!important}.warning{margin:17px auto 0;max-width:520px;padding:10px 12px;border-radius:14px;background:#fff1e7;color:#8e5148;font-size:13px;font-weight:900}.quiz{padding:20px}.quiz.nagabuchi-mode{background:linear-gradient(180deg,rgba(34,31,27,.985),rgba(49,40,29,.985));color:#fff6dd;border-color:#8d7335}.quiz.nagabuchi-mode .progress{background:#5d5344}.quiz.nagabuchi-mode .progress>div{background:linear-gradient(90deg,#f0c24d,#f07149)}.quiz.nagabuchi-mode .difficulty{color:#e5c878}.quiz.nagabuchi-mode .choice{background:#fffdf5;color:#2b2722}.quiz.nagabuchi-mode .feedback{background:#fff6dd;color:#3c3227}.progress-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:950}.difficulty{font-size:13px;color:#766d62}.progress{height:10px;background:#eee5d6;border-radius:999px;overflow:hidden;margin:12px 0 22px}.progress>div{height:100%;width:20%;background:linear-gradient(90deg,#ff8d7c,#ffbd69);transition:.3s}.reveal{display:none;margin:0 0 18px;padding:12px 14px;border:2px solid #d3ad45;border-radius:16px;background:linear-gradient(135deg,#211f1d,#3a2f22);color:#ffe59a;font-weight:1000;text-align:center;letter-spacing:.04em}.reveal.show{display:block;animation:reveal .65s ease}@keyframes reveal{0%{transform:scale(.92);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}.question{font-size:clamp(20px,4.8vw,29px);line-height:1.55;margin:0 0 17px;font-weight:1000;white-space:pre-line}.rulebox{font-size:13px;line-height:1.65;margin:-3px 0 16px;padding:11px 12px;border:1.5px dashed #c6a456;border-radius:14px;background:rgba(255,236,174,.10);color:#ffe9aa;font-weight:800;white-space:pre-line}.choices{display:grid;gap:11px}.choice{width:100%;text-align:left;padding:14px 15px;border:2px solid #ddd1bd;border-radius:17px;background:#fff;color:#2b2722;font-weight:900;line-height:1.45;cursor:pointer}.choice.correct{background:#e4f6ed!important;border-color:var(--good)!important;color:#186a4c!important}.choice.wrong{background:#ffe7e7!important;border-color:var(--bad)!important;color:#95373d!important}.choice:disabled{cursor:default}.feedback{display:none;margin-top:18px;padding:15px;border-radius:17px;background:#f6f0e5;line-height:1.7;font-weight:750}.feedback.show{display:block}.feedback .logic{margin-top:8px;font-size:13px;opacity:.86}.next{display:none;margin-top:14px}.next.show{display:block}.result{padding:28px 20px;text-align:center}.score{font-size:76px;line-height:1;font-weight:1000;margin:14px 0 8px}.rankbadge{display:inline-block;padding:9px 14px;border-radius:999px;background:var(--cream2);border:2px solid #d7b13f;font-weight:1000;font-size:18px}.rankdesc{max-width:550px;margin:13px auto 18px;line-height:1.7;color:#685f53;font-weight:750}.time{font-size:13px;color:#7b7165;font-weight:850;margin-bottom:18px}.board{margin:20px 0 18px;border:1.5px solid #e2d7c5;border-radius:18px;background:#fff;overflow:hidden;text-align:left}.board-title{padding:13px 14px;background:#fff4cf;font-weight:1000;border-bottom:1px solid #eadfca;display:flex;justify-content:space-between;gap:8px;align-items:center}.board-note{font-size:11px;color:#8a7d69;font-weight:800}.board-row{display:grid;grid-template-columns:44px 1fr 58px 76px;gap:7px;align-items:center;padding:11px 12px;border-bottom:1px solid #eee5d8;font-size:13px}.board-row:last-child{border-bottom:0}.board-row.current{background:#fff8d8}.board-row .r{font-weight:1000}.board-row .n{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.board-row .s,.board-row .t{text-align:right;font-weight:850}.actions{display:grid;gap:10px}.footer{text-align:center;color:#8b8173;font-size:12px;line-height:1.7;margin-top:16px}.fx{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:9999}.fx.show{animation:fxwrap 1.05s ease forwards}.fx .flash{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,230,48,.88) 0 10deg,rgba(229,55,55,.82) 10deg 20deg)}.fx .core{position:absolute;inset:16%;border-radius:50%;background:#fff8df;box-shadow:0 0 70px 45px #fff9}.fx .big{position:absolute;left:50%;top:12%;transform:translateX(-50%) rotate(-5deg);padding:12px 20px;background:#fff;border:5px solid #252525;border-radius:26px;color:#e63838;font-size:clamp(28px,8vw,48px);font-weight:1000;z-index:2;box-shadow:0 12px 0 #0002}.fx .line{position:absolute;left:50%;top:27%;transform:translateX(-50%) rotate(2deg);max-width:88vw;padding:10px 15px;background:#fff3c6;border:4px solid #252525;border-radius:20px;color:#252525;font-size:clamp(16px,4.7vw,25px);font-weight:1000;text-align:center;z-index:2}.fximg{position:absolute;width:90px;height:90px;object-fit:cover;border:3px solid #252525;border-radius:22px;background:#fff;z-index:3}.x1{left:5%;top:16%;transform:rotate(-13deg)}.x2{right:5%;top:18%;transform:rotate(13deg)}.x3{left:10%;bottom:14%;transform:rotate(9deg)}.x4{right:8%;bottom:14%;transform:rotate(-10deg)}.x5{left:50%;bottom:5%;transform:translateX(-50%)}@keyframes fxwrap{0%{opacity:0}8%{opacity:1}78%{opacity:1}100%{opacity:0}}@media(max-width:520px){.shell{padding:11px 11px 38px}.hero,.result{padding:22px 15px}.quiz{padding:17px 15px}.mascot{width:94px;height:80px}.bubble{font-size:14px}.score{font-size:62px}.board-row{grid-template-columns:38px 1fr 50px 66px;padding:10px 9px}.fximg{width:73px;height:73px}.fx .line{top:29%}}
</style>

<body>
<main class="shell">
<div class="topbar"><div class="brand">ちいかわ検定</div><div class="pill">史上最強・全5問</div></div>
<section id="start" class="card hero">
<div class="pill" style="display:inline-block;background:#fff0b8">史上最強</div><h1>ちいかわ検定<br>史上最強</h1><p class="sub">知識・記憶・ひらめき。全部使って5問を突破してください。<br><strong>今回は、普通の検定ではありません。</strong></p>
<div class="mascot-wrap"><img class="mascot mascot-img" alt="手描きキャラクター"><div class="bubble" id="startBubble">名前を入れてね。まあ、5問くらい余裕でしょ？</div></div>
<div class="namebox"><label for="playerName">挑戦者名</label><input id="playerName" maxlength="12" autocomplete="off" placeholder="例：ももこ"><div class="namehint">12文字まで。結果画面のランキングに表示されます。</div></div>
<button class="cta" id="startBtn">史上最強に挑戦する</button><button class="ghost" id="showBoardBtn">この端末のランキングを見る</button><div id="startBoard" class="board hidden"></div><div class="warning">⚠️ セイレーン編の重要なネタバレを含みます。</div>
</section>
<section id="quiz" class="card quiz nagabuchi-mode hidden">
<div class="progress-row"><span id="qnum">Q1 / 5</span><span class="difficulty" id="difficulty">★★★★☆</span></div><div class="progress"><div id="bar"></div></div><div id="reveal" class="reveal">⚡ ここから「別の知識」も必要です ⚡</div>
<div class="mascot-wrap" style="justify-content:flex-start;margin:0 0 17px"><img class="mascot mascot-img" style="width:78px;height:68px" alt=""><div class="bubble" id="taunt">……あれ？ 聞いてない？</div></div>
<h2 class="question" id="question"></h2><div class="rulebox" id="rulebox"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><button class="cta next" id="nextBtn">次の問題へ</button>
</section>
<section id="result" class="card result hidden">
<div class="mascot-wrap"><img class="mascot mascot-img" alt=""><div class="bubble" id="resultBubble"></div></div><div class="score"><span id="score">0</span><span style="font-size:.4em"> / 5</span></div><div class="rankbadge" id="rank"></div><p class="rankdesc" id="rankDesc"></p><div class="time" id="time"></div><div id="resultBoard" class="board"></div><div class="actions"><button class="cta" id="shareBtn">結果を友だちに送る</button><button class="secondary" id="restartBtn">別の名前で挑戦する</button></div>
</section>
<p class="footer">ファン制作の非公式クイズです。『ちいかわ』および長渕剛さん・関連作品の公式サイトではありません。</p>
</main>
<div id="wrongFx" class="fx" aria-hidden="true"><div class="flash"></div><div class="core"></div><div class="big">不正解！！</div><div class="line" id="wrongLine">両方わからないと無理だよ？</div><img class="fximg x1 mascot-img" alt=""><img class="fximg x2 mascot-img" alt=""><img class="fximg x3 mascot-img" alt=""><img class="fximg x4 mascot-img" alt=""><img class="fximg x5 mascot-img" alt=""></div>
<script>
const mascotSrc='../mascot.svg?v=20260818c';document.querySelectorAll('.mascot-img').forEach(el=>el.src=mascotSrc);
const questions=[
{q:"島二郎の激辛カレーで真っ赤になったちいかわに、島二郎が出した飲み物は？\nその「番号」と同じ曲順にある、長渕剛『ALL Time Best 2014』Disc1の曲を答えよ。",rule:"ちいかわ側\n1. 牛乳　2. のむヨーグルト　3. ラッシー　4. 炭酸水\n↓\n正しい番号＝長渕剛側の曲順",choices:["乾杯","俺らの家まで","巡恋歌","順子"],answer:1,difficulty:"★★★★☆",taunt:"Q1から二重ロック。ちいかわだけじゃ解けないよ？",ok:"……両方わかった？ これは強い。",ng:"え？ 片方しか知らなかったの？",exp:"ちいかわ側の正解は「2. のむヨーグルト」。『ALL Time Best 2014』Disc1の2曲目は「俺らの家まで」。",logic:"2 → Disc1の2曲目 →「俺らの家まで」"},
{q:"『島のうた』に登場する食べ物として「間違っているもの」の番号を求めよ。\nその番号と同じ曲順にある『富士山麓 ALL NIGHT LIVE 2015』2nd STAGEの曲は？",rule:"ちいかわ側\n1. わたあめ　2. じゃがバター　3. ケバブ　4. てりてりソースの焼きうどん\n↓\n間違っている食べ物の番号＝2nd STAGEの曲順",choices:["親知らず","三羽ガラス","SUPER STAR","とんぼ"],answer:2,difficulty:"★★★★★",taunt:"歌詞記憶と曲順記憶。どっちも必要。",ok:"焼き『そば』→4曲目まで繋げたの！？",ng:"焼きうどんで止まった？ その先もあるよ？",exp:"間違いは「4. てりてりソースの焼きうどん」。実際は焼きそば。2nd STAGEの4曲目は「SUPER STAR」。",logic:"4 → 2nd STAGE 4曲目 →「SUPER STAR」"},
{q:"セイレーンとの戦いで使われた激辛唐辛子の番号を求めよ。\nその番号と同じ曲順にある長渕剛『いつかの少年』Disc3の曲は？",rule:"ちいかわ側\n1. ハバネロ　2. ブート・ジョロキア　3. キャロライナ・リーパー　4. トリニダード・スコーピオン\n↓\n正しい番号＝『いつかの少年』Disc3の曲順",choices:["シリアス（ライヴ）","順子（ライヴ）","素顔（ライヴ）","巡恋歌'92"],answer:3,difficulty:"★★★★★＋",taunt:"ここから古参ファン領域。",ok:"キャロライナ・リーパーから巡恋歌'92まで行くの、何者？",ng:"『辛いやつ』だけじゃ突破できないんだよね〜。",exp:"唐辛子は「3. キャロライナ・リーパー」。『いつかの少年』Disc3の3曲目は「巡恋歌'92」。",logic:"3 → Disc3の3曲目 →「巡恋歌'92」"},
{q:"ヒトハが人魚を捕らえるために使ったものとして正しい組み合わせの番号を求めよ。\nその番号と同じ曲順にある『富士山麓 ALL NIGHT LIVE 2015』3rd STAGEの曲は？",rule:"ちいかわ側\n1. しるこサンド＋びんよよ\n2. たべっ子どうぶつ＋さすまた\n3. しるこサンド＋討伐棒\n4. ビスコ＋びんよよ\n↓\n正しい番号＝3rd STAGEの曲順",choices:["LONG LONG TIME AGO","CLOSE YOUR EYES","絆 -KIZUNA-","乾杯"],answer:2,difficulty:"★★★★★★",taunt:"小道具まで覚えて、そのあと富士山麓。容赦なし。",ok:"1番を導いて『絆』まで正解……認める。",ng:"しるこサンドだけ覚えててもダメなんだな〜。",exp:"正解は「1. しるこサンド＋びんよよ」。3rd STAGEの1曲目は「絆 -KIZUNA-」。",logic:"1 → 3rd STAGE 1曲目 →「絆 -KIZUNA-」"},
{q:"Q1〜Q4で「ちいかわ側の正解だった番号」をすべて足せ。\nその合計と同じ曲順にある『ALL Time Best 2014』Disc1の曲はどれ？",rule:"Q1=？　Q2=？　Q3=？　Q4=？\n4つの番号を合計 → Disc1の曲順へ",choices:["JEEP","しゃぼん玉","RUN","ひまわり"],answer:1,difficulty:"☠ MASTER",taunt:"今までの4問、全部が伏線でした。",ok:"……10まで出して『しゃぼん玉』。史上最強、認定。",ng:"最後に全部回収するって言ってないもんね？",exp:"ちいかわ側の正解番号は 2＋4＋3＋1＝10。『ALL Time Best 2014』Disc1の10曲目は「しゃぼん玉」。",logic:"2＋4＋3＋1＝10 → Disc1 10曲目 →「しゃぼん玉」"}
];
const ranks={5:{name:"史上最強マスター",desc:"5/5。ちいかわと長渕剛、両方の知識を同時に接続できる異常領域です。",bubble:"……全問正解？ もう検定を作る側でしょ。"},4:{name:"魂の二刀流",desc:"4/5。片方だけの知識ではここまで来られません。ほぼ史上最強。",bubble:"4問！？ かなりおかしいくらい強い。"},3:{name:"富士山麓級",desc:"3/5。二つの世界をかなり行き来できています。",bubble:"3問取るのも普通じゃないよ？"},2:{name:"知識の交差点",desc:"2/5。仕組みには気づいた。あとは両方の深掘り。",bubble:"二刀流への入口には立ったね。"},1:{name:"片翼の挑戦者",desc:"1/5。どちらか一方の知識だけでは突破できないのがこの検定。",bubble:"片方だけ詳しかった感じ？"},0:{name:"史上最強の壁",desc:"0/5。これは普通のちいかわ検定ではありません。また挑戦してください。",bubble:"0問……史上最強、なめてた？"}};
const STORAGE_KEY="chiikawa_strongest_ranking_v1";let current=0,score=0,locked=false,startTime=0,player="",runId="";const $=id=>document.getElementById(id);const start=$("start"),quiz=$("quiz"),result=$("result"),choices=$("choices"),feedback=$("feedback"),nextBtn=$("nextBtn");
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}function getBoard(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")}catch(e){return[]}}function saveBoard(rows){localStorage.setItem(STORAGE_KEY,JSON.stringify(rows.slice(0,30)))}function fmtTime(ms){const sec=Math.max(0,Math.round(ms/1000));const m=Math.floor(sec/60),s=sec%60;return m?`${m}:${String(s).padStart(2,"0")}`:`${s}秒`}function sortedBoard(rows){return rows.sort((a,b)=>b.score-a.score||a.timeMs-b.timeMs||a.at-b.at)}
function renderBoard(el,currentId=null){const rows=sortedBoard(getBoard()).slice(0,10);if(!rows.length){el.innerHTML='<div class="board-title"><span>ランキング</span><span class="board-note">この端末内</span></div><div style="padding:16px;text-align:center;color:#857a6b;font-weight:800">まだ挑戦者はいません。</div>';return}let h='<div class="board-title"><span>ランキング TOP10</span><span class="board-note">この端末内</span></div>';rows.forEach((r,i)=>{h+=`<div class="board-row ${r.id===currentId?'current':''}"><div class="r">${i+1}位</div><div class="n">${esc(r.name)}</div><div class="s">${r.score}/5</div><div class="t">${fmtTime(r.timeMs)}</div></div>`});el.innerHTML=h}
function showQuestion(){locked=false;const item=questions[current];$("qnum").textContent=`Q${current+1} / ${questions.length}`;$("difficulty").textContent=item.difficulty;$("bar").style.width=`${((current+1)/questions.length)*100}%`;$("question").textContent=item.q;$("rulebox").textContent=item.rule;$("taunt").textContent=item.taunt;$("reveal").classList.toggle("show",current===0);choices.innerHTML="";feedback.className="feedback";feedback.innerHTML="";nextBtn.className="cta next";nextBtn.textContent=current===questions.length-1?"結果を見る":"次の問題へ";item.choices.forEach((c,i)=>{const b=document.createElement("button");b.className="choice";b.textContent=`${String.fromCharCode(65+i)}. ${c}`;b.addEventListener("click",()=>answer(i,b));choices.appendChild(b)})}
function wrongFx(text){$("wrongLine").textContent=text;const fx=$("wrongFx");fx.classList.remove("show");void fx.offsetWidth;fx.classList.add("show");setTimeout(()=>fx.classList.remove("show"),1050)}function answer(index,button){if(locked)return;locked=true;const item=questions[current];const all=[...document.querySelectorAll(".choice")];all.forEach(b=>b.disabled=true);all[item.answer].classList.add("correct");const correct=index===item.answer;if(correct){score++;$("taunt").textContent=item.ok}else{button.classList.add("wrong");$("taunt").textContent=item.ng;wrongFx(item.ng)}feedback.innerHTML=`<strong>${correct?"正解！":"不正解…"}</strong><br>${item.exp}<div class="logic">${item.logic}</div>`;feedback.classList.add("show");nextBtn.classList.add("show")}
function finish(){quiz.classList.add("hidden");result.classList.remove("hidden");const elapsed=Date.now()-startTime;const r=ranks[score];$("score").textContent=score;$("rank").textContent=r.name;$("rankDesc").textContent=r.desc;$("resultBubble").textContent=r.bubble;$("time").textContent=`挑戦者：${player}　／　タイム：${fmtTime(elapsed)}`;const rows=getBoard();rows.push({id:runId,name:player,score,timeMs:elapsed,at:Date.now()});saveBoard(sortedBoard(rows));renderBoard($("resultBoard"),runId);window.scrollTo({top:0,behavior:"smooth"})}
$("startBtn").addEventListener("click",()=>{const name=$("playerName").value.trim();if(!name){$("startBubble").textContent="名前が空欄だよ？ 逃げる気？";$("playerName").focus();return}player=name.slice(0,12);runId=`${Date.now()}_${Math.random().toString(36).slice(2,8)}`;current=0;score=0;startTime=Date.now();start.classList.add("hidden");result.classList.add("hidden");quiz.classList.remove("hidden");showQuestion();window.scrollTo({top:0,behavior:"smooth"})});nextBtn.addEventListener("click",()=>{if(current<questions.length-1){current++;showQuestion();window.scrollTo({top:0,behavior:"smooth"})}else finish()});$("restartBtn").addEventListener("click",()=>{result.classList.add("hidden");start.classList.remove("hidden");$("playerName").value="";$("startBubble").textContent="名前を入れてね。まあ、5問くらい余裕でしょ？";window.scrollTo({top:0,behavior:"smooth"})});$("showBoardBtn").addEventListener("click",()=>{const b=$("startBoard");b.classList.toggle("hidden");if(!b.classList.contains("hidden"))renderBoard(b)});$("shareBtn").addEventListener("click",async()=>{const text=`ちいかわ検定「史上最強」で ${score}/5問正解！\n挑戦者：${player}\n階級：${ranks[score].name}\nあなたも史上最強に挑戦してみて！`;const url=location.href;try{if(navigator.share)await navigator.share({title:"ちいかわ検定｜史上最強",text,url});else{await navigator.clipboard.writeText(`${text}\n${url}`);$("shareBtn").textContent="結果とリンクをコピーしました！";setTimeout(()=>$("shareBtn").textContent="結果を友だちに送る",1800)}}catch(e){}});
</script>
