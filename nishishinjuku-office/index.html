<stop offset=\"1\" stop-color=\"#73505c\"/></linearGradient></defs><rect width=\"640\" height=\"200\" rx=\"20\" fill=\"url(#night)\"/><g fill=\"#2c344b\"><path d=\"M0 0H195L243 200H0Z\"/><path d=\"M640 0H440L393 200H640Z\"/></g><path d=\"M243 200L287 67H353L397 200\" fill=\"#ba8475\" opacity=\".5\"/><path d=\"M286 67H354L397 200H243Z\" fill=\"#e6b284\" opacity=\".17\"/><g><rect x=\"94\" y=\"37\" width=\"60\" height=\"93\" rx=\"15\" fill=\"#d84c50\"/><rect x=\"483\" y=\"29\" width=\"62\" height=\"98\" rx=\"15\" fill=\"#d84c50\"/><path d=\"M124 24V37M514 15V29\" stroke=\"#f8d9ac\" stroke-width=\"5\"/><path d=\"M94 47H154M483 39H545\" stroke=\"#f5b0a0\" stroke-width=\"5\"/><text x=\"124\" y=\"94\" font-size=\"30\" text-anchor=\"middle\" fill=\"#fff1cf\">酒</text><text x=\"514\" y=\"87\" font-size=\"30\" text-anchor=\"middle\" fill=\"#fff1cf\">串</text></g><g stroke=\"#ffdd9a\" stroke-width=\"2\" opacity=\".7\"><path d=\"M0 8H640\"/><path d=\"M215 0L240 70M425 0L401 70\"/></g></svg>", "eye": "<svg viewBox=\"0 0 640 200\" aria-hidden=\"true\"><rect width=\"640\" height=\"200\" rx=\"20\" fill=\"#c9dbe8\"/><path d=\"M0 39H640M0 171H640\" stroke=\"#6b849c\" stroke-width=\"12\"/><g fill=\"#657b91\"><rect x=\"35\" y=\"0\" width=\"20\" height=\"200\"/><rect x=\"585\" y=\"0\" width=\"20\" height=\"200\"/></g><g transform=\"translate(152 36)\"><path d=\"M0 62Q162 -53 336 62Q162 177 0 62Z\" fill=\"#fff8ed\" stroke=\"#476177\" stroke-width=\"10\"/><circle cx=\"168\" cy=\"62\" r=\"53\" fill=\"#8eaac3\" stroke=\"#4a6378\" stroke-width=\"10\"/><circle cx=\"168\" cy=\"62\" r=\"23\" fill=\"#263c56\"/><circle cx=\"154\" cy=\"46\" r=\"10\" fill=\"#e9f3f7\"/></g><rect y=\"190\" width=\"640\" height=\"10\" fill=\"#8ca4b9\"/></svg>"};
(()=>{'use strict';
const app=document.getElementById('app');const KEY='nishishinjuku_office_scores_v1';
let state={view:'home',name:'',index:0,answers:[],choice:null,score:0,recordId:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));
function readBoard(){try{let v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[]}catch(e){return temp.slice()}}
let temp=[];function saveBoard(e){temp=readBoard().concat(e).sort((a,b)=>b.score-a.score||a.at-b.at).slice(0,100);try{localStorage.setItem(KEY,JSON.stringify(temp))}catch(e){}};
function mascot(i,klass='mascot'){return `<img class="${klass}" src="${MASCOTS[i]}" alt="くるくる髪の手描きキャラクター">`}
function btn(text,action,kind='primary'){return `<button type="button" class="${kind}" data-action="${action}">${text}</button>`}
function bind(){app.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>actions[el.dataset.action]?.()))}
function base(s){app.innerHTML='<span class="decor one" aria-hidden="true">✦</span><span class="decor two" aria-hidden="true">✧</span>'+s}
const actions={
start(){let n=document.getElementById('nickname').value.trim().normalize('NFKC');if(!n||n.length>16){document.getElementById('err').textContent='1〜16文字で名前を入力してください';return}state={view:'quiz',name:n,index:0,answers:[],choice:null,score:0,recordId:null};render()},
next(){if(state.choice===null){document.getElementById('err').textContent='答えを1つ選んでね';return}state.answers.push(state.choice);state.choice=null;if(state.index===QUESTIONS.length-1){state.score=QUESTIONS.reduce((n,q,i)=>n+(q.answer===state.answers[i]?1:0),0);state.recordId=(crypto?.randomUUID?.()||String(Date.now()));saveBoard({id:state.recordId,name:state.name,score:state.score,at:Date.now()});state.view='result';render();celebrate()}else{state.index++;render()}},
restart(){state.view='home';state.index=0;state.answers=[];state.choice=null;render()},
board(){state.view='board';render()},
back(){state.view=state.answers.length===5?'result':'home';render()},
share(){const url=new URL(location.href);url.search='?v=1';url.hash='';const msg='🏙️ 西新宿サラリーマン生存検定に挑戦！\n待ち合わせ、会議、昼休み、退勤後。西新宿を知ってる人に贈る全5問の4択クイズ 💼\n'+url.href;if(navigator.share){navigator.share({title:'西新宿サラリーマン生存検定',text:msg}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(msg).then(()=>alert('ネタバレなし招待文をコピーしました！')).catch(()=>alert(msg))}else alert(msg)}
};
function home(){base(`<p class="eyebrow">WELCOME TO THE OFFICE JUNGLE</p><h1 class="headline">西新宿<br><span class="accent">サラリーマン<br>生存検定。</span></h1><p class="sub">新宿西口の地下道、終わらない会議、上司との待ち合わせ。<br>あなたはこのオフィス街で生き残れるか？☕</p><div class="hero"><div class="hero-glow"></div><div class="skyline">${SCENES.morning}</div>${mascot(0)}<div class="bubble">西新宿勤務なら<br>楽勝だよね？♡</div></div><label class="label" for="nickname">✎ 社員名（ニックネーム）を記入</label><input id="nickname" class="name" maxlength="16" autocomplete="nickname" placeholder="例：都庁前の残業戦士" value="${esc(state.name)}"><p id="err" class="error"></p>${btn('出勤する → テスト開始','start')}<button class="smalllink" data-action="board">🏆 先輩たちのランキング</button><div class="pills"><span class="pill">☕ 昼休みあるある</span><span class="pill">💼 営業・会議</span><span class="pill">🍻 退勤後</span></div><p class="fineprint" style="margin:6px 0 0">回答中は正解を表示しません。最後にまとめて判定します。</p>`);document.getElementById('nickname').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)actions.start()});bind()}
function quiz(){const q=QUESTIONS[state.index];base(`<div class="topline"><span class="chip">📎 ${esc(state.name)} さん</span><span class="counter">QUESTION ${state.index+1} / 5</span></div><div class="progress">${QUESTIONS.map((_,i)=>`<span class="${i<state.index?'done':i===state.index?'active':''}"></span>`).join('')}</div><span class="time">◷ ${q.time}　${esc(q.tag)}</span><h2 class="question">${esc(q.title)}</h2><div class="scene">${SCENES[q.scene]}</div><div class="options" role="group" aria-label="四択の回答">${q.opts.map((v,i)=>`<button class="choice" type="button" aria-pressed="false" data-choice="${i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(v)}</span></button>`).join('')}</div><p class="error" id="err"></p>${btn(state.index===4?'退勤！最終判定を見る 🎉':'次の業務へ進む →','next')}<p class="qfoot">※ 途中では正解を表示しません</p>`);app.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>{state.choice=Number(el.dataset.choice);app.querySelectorAll('[data-choice]').forEach(x=>{const sel=x===el;x.classList.toggle('selected',sel);x.setAttribute('aria-pressed',sel?'true':'false')});document.getElementById('err').textContent=''}));bind()}
function result(){const s=state.score;const pos=[1,2,0,3,4,5][s];base(`<p class="eyebrow">YOUR OFFICE SURVIVAL RANK</p><div class="resultbox"><p style="font-size:12px;font-weight:900;color:#9d7b4d">${esc(state.name)} さんの勤務適性（※ジョーク）</p><h1 class="rank">${LABELS[s]}</h1><div class="score">${s}<small> / 5問正解</small></div>${mascot(pos,'resultmascot')}<div class="taunt">${TAUNTS[s]}</div></div>${btn('📨 友達にクイズを送る（ネタバレなし）','share')}<div class="answerlist"><h3>📝 業務報告書・正解発表</h3>${QUESTIONS.map((q,i)=>{const yes=state.answers[i]===q.answer;return `<div class="answeritem ${yes?'':'wrong'}"><div class="answericon">${yes?'◯':'✕'}</div><div class="answertext"><b>Q${i+1}　${esc(q.title)}</b><span>正解：${esc(q.opts[q.answer])}</span><div class="your">あなたの回答：${esc(q.opts[state.answers[i]])} ${yes?'（正解）':'（不正解）'}</div><div class="detail">${esc(q.detail)}</div></div></div>`}).join('')}</div><div class="rowbuttons">${btn('🏆 ランキング','board','secondary')}${btn('もう一度出勤','restart','secondary')}</div>`);bind()}
function board(){const list=readBoard().slice(0,100);base(`<p class="eyebrow">LOCAL OFFICE RANKING</p><h1 class="headline" style="font-size:34px">🏆 社内番付</h1><p class="sub">高得点順。同点の場合は先に解答した人が上位です。<br>これは<strong>この端末内のランキング</strong>です。</p><div class="board"><div class="boardhead"><h3>社員ランキング</h3><span class="local">この端末のみ</span></div>${list.length?list.map((e,i)=>`<div class="entry ${e.id===state.recordId?'mine':''}"><span class="medal">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</span><div class="who">${esc(e.name)}${e.id===state.recordId?'（あなた）':''}<small>${LABELS[e.score]||''}</small></div><span class="pts">${e.score}<small>/5</small></span></div>`).join(''):'<div class="empty">まだ記録がありません。最初の社員になろう！</div>'}</div><p class="note">💡 友達全員が同じランキングを見るには、別途サーバー側の記録機能が必要です。</p><div style="margin-top:22px">${btn('← 戻る','back','secondary')}</div>`);bind()}
function celebrate(){if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;let flash=document.createElement('div');flash.className='flash';document.body.append(flash);setTimeout(()=>flash.remove(),750);const colors=['#f4bb50','#ee8174','#80c7b8','#b6d6e3','#ffffff'];for(let i=0;i<70;i++){const el=document.createElement('i');el.className='confetti';el.style.background=colors[i%colors.length];el.style.left=Math.random()*100+'%';el.style.setProperty('--dx',((Math.random()-.5)*280)+'px');el.style.setProperty('--rotate',((Math.random()-.5)*1000)+'deg');el.style.setProperty('--duration',(2.1+Math.random()*2.4)+'s');el.style.animationDelay=(Math.random()*.7)+'s';document.body.append(el);setTimeout(()=>el.remove(),5600)}}
function render(){if(state.view==='quiz')quiz();else if(state.view==='result')result();else if(state.view==='board')board();else home()}
render();
})();</script></body></html>
