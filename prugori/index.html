const RANKS=['髪型自由の見学者','名刺交換ルーキー','青スーツ見習い','日サロ研修修了','港系スタイル習得','伝説のLPカット'];
const TAUNTS=['まずは理容室の予約から始めようか♡','ネクタイだけはキマってるね♡','青スーツは似合う。知識はこれから♡','理容室で合言葉、言えるようになった？♡','その知識、ちょっと濃すぎない？♡','御用達理容室で「いつもの」が通じるレベル👑'];
const KEY='prugori_quiz_20261111_culture_v3';
const app=document.getElementById('app');
const state={page:'home',name:'',index:0,selected:null,answers:[],result:null,board:[]};
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[ch]));
let memoryBoard=[];
function getBoard(){try{const stored=localStorage.getItem(KEY);return stored?JSON.parse(stored):memoryBoard.slice()}catch{return memoryBoard.slice()}}
function setBoard(list){memoryBoard=list.slice();try{localStorage.setItem(KEY,JSON.stringify(list))}catch{}}
function shell(body){app.innerHTML='<div class="sheet-inner"><div class="flower" aria-hidden="true">✳</div>'+body+'</div>';app.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click',()=>actions[el.dataset.act]?.()))}
const button=(t,action,cl='')=>'<button type="button" data-act="'+action+'" class="cta '+cl+'">'+t+'</button>';
function home(){shell('<div class="tag">LIFE PLANNER CULTURE QUIZ</div><h1 class="hero-title">プルゴリ<br><span>認定試験。</span></h1><p class="sub">青スーツ、赤ネクタイ、そして伝説のLP。<br>独特な営業文化とネットの語り草を全5問でテスト。答えは最後まで秘密だよ♡</p><div class="hero"><img src="'+PICTURES[0]+'" alt="青スーツと赤ネクタイのくるくる髪マスコット"><div class="bubble">5問満点<br>いけるよね？♡</div></div><label class="fields-label" for="nickname">✎ ニックネーム</label><input id="nickname" class="name-input" type="text" maxlength="16" autocomplete="nickname" placeholder="例：外資系の申し子" value="'+escapeHtml(state.name)+'"><p class="error" id="name-error"></p>'+button('検定スタート ✦','start','red')+'<div class="links"><button class="mini" type="button" data-act="leaderboard">🏆 この端末のランキング</button><button class="mini" type="button" data-act="share">📣 友達に招待状を送る</button></div><div class="pills"><span class="pill">👔 4択 × 5問</span><span class="pill">💙 6段階ランク</span><span class="pill">🎉 派手な結果発表</span></div><div class="sponsor">※非公式ジョーククイズです。一部は報道された特定支社の過去の事例、元LPの公開発言、企業の公式情報を題材にしています。現役の全LPに当てはまる話ではありません。</div>');const input=document.getElementById('nickname');input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)actions.start()})}
function quiz(){const q=DATA[state.index];const meter=DATA.map((_,i)=>'<b class="'+(i<state.index?'past':i===state.index?'live':'')+'"></b>').join('');shell('<div class="countline"><span>👔 '+escapeHtml(state.name)+' さん</span><span>QUESTION '+(state.index+1)+' / '+DATA.length+'</span></div><div class="meter" aria-label="進捗">'+meter+'</div><div class="tag">'+escapeHtml(q.tag)+'</div><h2 class="question-title">'+escapeHtml(q.prompt)+'</h2><p class="scenario">正しい答えを1つ選んでね。</p><div class="choices" role="group" aria-label="解答の選択肢">'+q.options.map((opt,i)=>'<button type="button" class="choice" aria-pressed="'+(state.selected===i?'true':'false')+'" data-choice="'+i+'"><span class="letter">'+('ABCD'[i])+'</span><span>'+escapeHtml(opt)+'</span></button>').join('')+'</div><p class="error" id="choice-error"></p>'+button(state.index===DATA.length-1?'運命のランク発表へ！ 👑':'次の問題へ ✦','next')+'<p class="quiet">この段階では正解を出しません。最後にまとめて発表！</p>');app.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>{state.selected=Number(el.dataset.choice);app.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-pressed',b===el?'true':'false'));document.getElementById('choice-error').textContent=''}));}
function record(){const score=state.answers.reduce((sum,v,i)=>sum+(v===DATA[i].answer?1:0),0);state.result={score,rank:RANKS[score],correct:DATA.map((q,i)=>state.answers[i]===q.answer)};const list=getBoard();list.push({id:Date.now()+Math.random(),name:state.name,score,at:Date.now()});list.sort((a,b)=>b.score-a.score||a.at-b.at);state.board=list.slice(0,100);setBoard(state.board);state.page='result';render();celebrate()}
function answerSheet(){return '<section class="answer-sheet"><h3>📝 解答カルテ</h3>'+DATA.map((q,i)=>'<div class="answer"><div class="answer-title"><span class="mark '+(state.result.correct[i]?'':'wrong')+'">'+(state.result.correct[i]?'◯':'✕')+'</span> Q'+(i+1)+' '+escapeHtml(q.prompt)+'</div><div class="answer-detail">正解：<strong>'+escapeHtml(q.options[q.answer])+'</strong><br>あなたの答え：'+escapeHtml(q.options[state.answers[i]])+'<br>'+escapeHtml(q.detail)+'</div><a class="answer-source" target="_blank" rel="noreferrer" href="'+escapeHtml(q.source)+'">出典を確認</a></div>').join('')+'</section>'}
function result(){const s=state.result.score;shell('<div class="result-head"><div class="tag">YOUR RESULT</div><p class="score-head">'+escapeHtml(state.name)+' さんのランクは…</p><h1 class="rank">'+escapeHtml(RANKS[s])+'</h1><div class="score">'+s+'<small> / 5問正解</small></div><img class="result-img" src="'+PICTURES[s>=3?1:0]+'" alt="青スーツ姿のマスコット"><div class="taunt">'+escapeHtml(TAUNTS[s])+'</div></div><div class="btn-pair">'+button('📣 得点とランクをシェア','shareResult','red')+button('🏆 ランキングを見る','leaderboard','secondary')+'</div>'+answerSheet()+'<div class="btn-pair">'+button('もう一度チャレンジ','restart','secondary')+'</div>');}
function board(){state.board=getBoard();shell('<div class="tag">LEADERBOARD</div><h1 class="hero-title" style="font-size:37px">🏆 ランキング</h1><p class="sub">このiPhoneなど、<strong>同じ端末・ブラウザ内</strong>で挑戦した人のスコアです。同点の場合は先に回答した人が上位！</p>'+(state.board.length?state.board.map((x,i)=>'<div class="leader-row"><span style="font-size:22px">'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1)+'</span><div><div class="leader-name">'+escapeHtml(x.name)+'</div><div class="leader-meta">'+escapeHtml(RANKS[x.score])+'</div></div><div class="leader-score">'+x.score+'<small>/5</small></div></div>').join(''):'<div class="empty">まだ誰も挑戦していません。<br>初代王者はあなたかも？♡</div>')+'<p class="rank-note">別のスマホとの共通ランキングは未設定です。ニックネームに本名は使わないでね。</p>'+button('← 戻る','back','secondary'))}
function share(){const url=new URL(location.href);url.search='?v=4';url.hash='';const text='👔 プルゴリ検定に挑戦！\n青スーツのマスコットが出迎える、伝説のLPや独特な営業文化を当てる全5問4択クイズ。\n'+url.toString();if(navigator.share)navigator.share({title:'プルゴリ検定',text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>alert('招待文をコピーしたよ♡')).catch(()=>alert(text));else alert(text)}
function resultMessage(){const url=new URL(location.href);url.search='?v=4';url.hash='';return '🎉 プルゴリ検定で【'+state.result.score+'/5問正解】！\n👔 ランク：'+state.result.rank+'\n💙❤️ あなたも伝説のLPを目指せるか？\n'+url.toString()}
function shareResult(){if(!state.result){share();return}const text=resultMessage();if(navigator.share){navigator.share({title:'プルゴリ検定の結果',text}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>alert('得点とランクをコピーしたよ♡')).catch(()=>alert(text))}else alert(text)}
const actions={start(){const val=(document.getElementById('nickname')?.value||'').normalize('NFKC').trim();if(!val||val.length>16){document.getElementById('name-error').textContent='1〜16文字でニックネームを入力してね';return}state.name=val;state.index=0;state.selected=null;state.answers=[];state.result=null;state.page='quiz';render()},next(){if(state.selected===null){document.getElementById('choice-error').textContent='1つ選んでから進んでね♡';return}state.answers.push(state.selected);state.selected=null;if(state.index<DATA.length-1){state.index++;render()}else record()},restart(){state.page='home';state.index=0;state.selected=null;state.answers=[];state.result=null;render()},leaderboard(){state.page='board';render()},back(){state.page=state.result?'result':'home';render()},share,shareResult};
function render(){if(state.page==='home')home();else if(state.page==='quiz')quiz();else if(state.page==='result')result();else board()}
function celebrate(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const layer=document.createElement('div');layer.className='burst';document.body.appendChild(layer);const colors=['#1a4f9e','#dc2744','#e9bb52','#fff','#7ac5ee'];for(let i=0;i<75;i++){const el=document.createElement('i');el.className='confetti';el.style.left=(Math.random()*100)+'%';el.style.backgroundColor=colors[i%colors.length];el.style.setProperty('--d',(2.6+Math.random()*2.6)+'s');el.style.setProperty('--x',((Math.random()-.5)*260)+'px');el.style.setProperty('--r',(Math.random()*1200-600)+'deg');el.style.animationDelay=(Math.random()*.7)+'s';layer.append(el)}const flash=document.createElement('div');flash.className='flash';document.body.append(flash);setTimeout(()=>{layer.remove();flash.remove()},5700)}
render();
})();
</script></body></html>
