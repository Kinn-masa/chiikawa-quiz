Height='220px';"><span class="${q.mask}" style="${q.mask?'':'display:none'}">？</span></div><div class="choices">${q.opts.map((o,i)=>`<button type="button" class="choice" data-choice="${i}" aria-pressed="false"><span class="letter">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div><p class="error" id="err"></p>${btn(n===5?'結果を発表する！ 👑':'次の問題へ →','next')}<p class="notice">正解は最後にまとめて公開します</p>`;app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.sel=+b.dataset.choice;app.querySelectorAll('[data-choice]').forEach(x=>{x.classList.toggle('sel',x===b);x.setAttribute('aria-pressed',x===b?'true':'false')})});bind()};const confetti=()=>{for(let i=0;i<90;i++){let d=document.createElement('i');d.className='conf';d.style.left=Math.random()*100+'%';d.style.background=['#ff99f2','#c186ff','#ffe69d','#9bffe7'][i%4];d.style.setProperty('--x',(Math.random()-.5)*380+'px');d.style.animationDelay=Math.random()*.8+'s';document.body.append(d);setTimeout(()=>d.remove(),3500)}};const result=()=>{app.innerHTML=`<p class="kicker">RESULT REVEALED</p><h2 class="title">${esc(state.name)} さんの<br>古参度は…</h2><div class="score">${state.score}<span style="font-size:24px"> / 5</span></div><div class="rank">${ranks[state.score]}</div><div class="taunt">${taunts[state.score]}</div>${btn('📣 結果をシェア','share')}<h2 style="margin-top:35px">📜 答え合わせ</h2>${Q.map((q,i)=>`<div class="answer"><h3><span class="${state.answers[i]===q.correct?'good':'bad'}">${state.answers[i]===q.correct?'○':'×'}</span> 第${i+1}問　${esc(q.name)}</h3><p class="ansmeta">正解：${esc(q.opts[q.correct])}<br>あなたの回答：${esc(q.opts[state.answers[i]]||'未回答')}<br>${esc(q.info)}</p></div>`).join('')}<div class="btns">${btn('🏆 ランキングを見る','board')}${btn('もう一度遊ぶ','restart',true)}</div>`;bind();confetti()};const showBoard=()=>{let b=board();app.innerHTML=`<p class="kicker">LOCAL HALL OF FAME</p><h1 class="title">🏆 ランキング</h1><p class="sub">このiPhone・ブラウザで遊んだ記録のみ表示します。</p>${b.map((e,i)=>`<div class="boardentry"><span style="font-size:20px">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</span><div style="flex:1"><strong>${esc(e.name)}</strong><small>${ranks[e.score]}</small></div><b>${e.score}/5</b></div>`).join('')||'<p class="sub">まだ記録がありません。最初の挑戦者になろう！</p>'}<div class="btns">${btn('← 戻る','back',true)}</div>`;bind()};const actions={start(){let n=app.querySelector('#nm')?.value?.trim();if(!n||n.length>16){app.querySelector('#err').textContent='名前は1〜16文字で入力してね';return}state={screen:'quiz',name:n,index:0,answers:[],sel:null,score:0,record:null};quiz()},next(){if(state.sel===null){app.querySelector('#err').textContent='答えを選んでね';return}state.answers.push(state.sel);state.sel=null;if(state.index===4){state.score=state.answers.reduce((v,a,i)=>v+(a===Q[i].correct),0);state.screen='result';save();result()}else{state.index++;quiz()}},restart(){state.screen='home';state.answers=[];home()},board(){state.screen='board';showBoard()},back(){state.screen=state.answers.length===5?'result':'home';state.screen==='result'?result():home()},share(){let msg=`${state.name} のネット古参度は「${ranks[state.score]}」！ ${state.score}/5問正解！ ${location.href.split('#')[0]}`;if(navigator.share)navigator.share({text:msg}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(msg).then(()=>alert('コピーしたよ！')).catch(()=>alert(msg));else alert(msg)}};home()})();
</script></body></html>
