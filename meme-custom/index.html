<title>ネットミーム人物名鑑 ♡ 古参度チェック</title>
<style>
:root{--ink:#27213f;--muted:#746d8b;--purple:#8356db;--pink:#f36da9;--line:#e9ddf6;--paper:#fff;--cream:#fff9ed;--yellow:#ffdf91;--good:#15947c;--bad:#ed6b87}
*{box-sizing:border-box}
html{min-height:100%;background:#f6edff}
body{margin:0;min-height:100vh;color:var(--ink);font-family:ui-rounded,'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',Meiryo,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.55}
body::before{content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;background:radial-gradient(circle at 8% 11%,#ffe4ef 0%,transparent 36%),radial-gradient(circle at 93% 58%,#e6d6ff 0%,transparent 38%),linear-gradient(140deg,#fffaf4,#f5ecff 65%,#fdf2ff)}
body::after{content:"";position:fixed;inset:0;z-index:-2;opacity:.17;pointer-events:none;background-image:radial-gradient(#c5acd9 1px,transparent 1px);background-size:28px 28px}
button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #9665de;outline-offset:3px}
#app{width:min(100%,680px);margin:0 auto;padding:16px 16px calc(34px + env(safe-area-inset-bottom))}
.masthead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:7px 0 18px}
.logo{font-size:11px;font-weight:1000;letter-spacing:.105em;color:#7462a8}.edition{font-size:10px;font-weight:950;padding:8px 11px;border-radius:999px;background:#fff;border:1px solid #eee1fb;box-shadow:0 4px 14px #7850a211;color:#9276a8}
.card{background:rgba(255,255,255,.97);border:1px solid #f0e7f8;border-radius:26px;padding:26px clamp(16px,5vw,34px);box-shadow:0 22px 55px #6c3c901a,0 3px 9px #7867aa0a;overflow:hidden;position:relative}
.card::before{content:"";position:absolute;top:0;left:26px;right:26px;height:4px;border-radius:0 0 8px 8px;background:linear-gradient(90deg,var(--pink),#baa3ff,#ffdc83)}
.eyebrow{font-size:12px;font-weight:1000;letter-spacing:.12em;color:#aa78c3;text-align:center;margin:7px auto 8px}
.heroTitle{font-size:clamp(34px,9vw,52px);font-weight:1000;text-align:center;letter-spacing:-.07em;line-height:1.23;margin:0}.heroTitle em{font-style:normal;color:var(--pink);text-shadow:2px 2px 0 #fce9f4}
.subtitle{font-size:14px;color:var(--muted);text-align:center;line-height:1.85;margin:18px 0 10px}
.mascotArea{position:relative;min-height:226px;display:flex;align-items:center;justify-content:center;margin:7px auto 6px}
.mascotArea::before{content:"";position:absolute;width:225px;height:212px;border-radius:50%;background:radial-gradient(circle,#fff1cf,#f6d5ff 56%,transparent 75%);z-index:0;filter:blur(1px)}
.mascot{position:relative;z-index:1;width:205px;max-height:236px;object-fit:contain;filter:drop-shadow(0 12px 7px #49246125);animation:float 3.5s ease-in-out infinite}
.mascotArea .speech{position:absolute;z-index:2;right:0;top:25px;max-width:153px;padding:11px 12px;border:2px solid #29223c;background:#fffefb;border-radius:17px;transform:rotate(6deg);font-size:12px;line-height:1.4;font-weight:1000;text-align:center;box-shadow:4px 5px 0 #f6bad1}
.sparkle{position:absolute;z-index:2;color:#da7cbd;font-weight:900;font-size:30px;left:6%;top:24px}.sparkle.second{left:auto;right:12%;top:auto;bottom:14px;color:#bca0e9}
.label{display:block;margin:20px 0 7px;font-size:13px;font-weight:900}.nameInput{width:100%;padding:15px 17px;border:2px solid #e3d8f0;border-radius:15px;background:#fcfaff;color:var(--ink);font-size:16px;box-shadow:inset 0 1px 3px #5b458006}.nameInput:focus{border-color:#b794e8}
.err{min-height:20px;color:#cd5275;font-size:12px;font-weight:700;margin:5px 0}.btn{display:inline-flex;justify-content:center;align-items:center;gap:9px;width:100%;min-height:54px;border:0;border-radius:16px;font-size:16px;font-weight:1000;padding:12px 15px;background:linear-gradient(115deg,#f568a2,#a87cff);color:white;box-shadow:0 8px 0 #d9b9ec,0 18px 27px #d777a722;transition:filter .16s,transform .16s}
.btn:active{transform:translateY(4px);box-shadow:0 4px 0 #d9b9ec}.btn.secondary{background:#fff;color:#74519c;border:2px solid #dfcff2;box-shadow:none;min-height:48px;font-size:14px}.btn.ghost{background:transparent;color:#7b628e;box-shadow:none;min-height:43px;font-size:13px}
.chips{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:25px 0 2px}.chip{padding:6px 10px;border-radius:999px;background:#f8f0ff;border:1px solid #eee2fc;color:#805f9f;font-size:10px;font-weight:850}
.note{font-size:11px;color:#91899e;text-align:center;line-height:1.7;margin:19px auto 0}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:900}.user{color:#a46fac}.qnum{font-family:Georgia,serif;font-size:13px;color:#66538a}.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0 22px}.bar span{height:8px;border-radius:100px;background:#f0e9f5}.bar span.done{background:#d4a8ed}.bar span.now{background:#ef78ac;box-shadow:0 0 0 2px #f9d9e8}
.prompt{color:#a574b9;text-align:center;font-size:11px;font-weight:1000;letter-spacing:.12em}.questionTitle{text-align:center;font-size:clamp(21px,6.5vw,30px);letter-spacing:-.04em;line-height:1.4;margin:11px 0 16px;font-weight:1000}
.photoFrame{position:relative;border:6px solid #fff;border-radius:17px;background:#f0eaf7;box-shadow:0 6px 20px #56316e20,0 0 0 1px #ebdff7;max-width:540px;margin:0 auto 12px;overflow:hidden;isolation:isolate}
.photoFrame img{display:block;max-height:435px;max-width:100%;width:100%;object-fit:contain;margin:0 auto;background:#f1edf7;cursor:zoom-in}
.photoFrame.group img{max-height:395px}.photoFrame.portrait img{max-height:410px}.zoomHint{font-size:10px;font-weight:850;background:#ffffffee;border-radius:12px;position:absolute;bottom:9px;right:9px;padding:5px 9px;color:#70548c;pointer-events:none}
.questionSide{font-size:11px;text-align:center;color:#83758f;margin:5px auto 13px;font-weight:700}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:14px 0 14px}.choice{min-height:70px;display:flex;align-items:center;justify-content:flex-start;gap:9px;border:2px solid #e6dced;background:#fffefa;border-radius:15px;padding:12px 10px;text-align:left;font-weight:900;font-size:14px;color:#3b3051;line-height:1.4;transition:background .16s,border .16s,transform .16s}
.choice .key{flex:0 0 26px;height:26px;display:grid;place-items:center;background:#f0e6f7;border-radius:8px;color:#8b6aa1;font:900 13px Georgia,serif}
.choice.selected{background:#fff0f7;border-color:#ee7fb1;box-shadow:0 0 0 3px #f3c6e333}.choice.selected .key{color:#fff;background:#ea79a9}.choice:active{transform:scale(.985)}
.resultHeader{text-align:center}.resultSmall{color:#a57ca3;font-size:12px;font-weight:900;letter-spacing:.08em;margin:7px 0 13px}.resultRank{font-size:clamp(26px,8vw,47px);font-weight:1000;line-height:1.3;letter-spacing:-.05em;margin:0;background:linear-gradient(100deg,#e56a9e,#7857ce,#d3a453);-webkit-background-clip:text;background-clip:text;color:transparent}.score{font-family:Georgia,serif;font-size:65px;font-weight:900;color:#5e477f;margin:2px 0 0;line-height:1.3}.score span{font-size:18px;color:#a49bb0}.resultMascot{height:200px;max-width:94%;margin:3px auto;object-fit:contain;filter:drop-shadow(0 10px 8px #593e6a28);animation:bob .9s ease-in-out infinite alternate}
.taunt{margin:12px auto 20px;display:table;background:#fff2d1;color:#674d30;max-width:100%;padding:13px 19px;border:2px solid #deb881;border-radius:15px;box-shadow:4px 5px 0 #f4d9e7;font-size:15px;font-weight:1000;transform:rotate(-2deg)}
.sectionTitle{font-size:18px;font-weight:1000;margin:27px 0 13px}.review{display:grid;gap:10px}.reviewItem{border:1px solid #ecdfef;border-radius:14px;background:#fff;padding:13px 14px}.reviewItem.incorrect{background:#fffafc;border-color:#f2d6dd}.reviewTop{display:flex;gap:8px;align-items:flex-start;font-size:13px;font-weight:900}.mark{flex:0 0 24px;width:24px;height:24px;border-radius:100px;display:grid;place-items:center;background:#e3fff7;color:#179277;font-weight:900}.mark.no{background:#ffe9ef;color:#d96c84}.answer{font-size:12px;color:#6f647c;margin:6px 0 0 32px}.answer strong{color:#493958}.explain{font-size:12px;color:#8b8290;margin:5px 0 0 32px}
.btngrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.boardHead{font-size:29px;font-weight:1000;text-align:center;margin:8px 0}.boardSub{text-align:center;color:#887b95;font-size:12px;margin:3px 0 17px}.rowboard{display:grid;grid-template-columns:35px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid #ece2f3;padding:12px 10px;border-radius:14px;margin:8px 0}.rowboard.me{background:#fff2f8;border:2px solid #f3a0c3}.rankIcon{font-size:20px;font-weight:900;text-align:center}.boardName{min-width:0;font-size:14px;font-weight:900;overflow-wrap:anywhere}.boardTier{font-size:10px;color:#988aa2}.boardScore{font:900 20px Georgia,serif;color:#6e4e96}.boardScore small{font-size:11px}.localBadge{background:#f3ebfc;color:#8367a0;border-radius:100px;padding:6px 9px;font-size:11px;font-weight:900;display:table;margin:4px auto 0}.empty{text-align:center;font-size:13px;color:#9a8aa8;padding:32px 10px;border:2px dashed #decfe9;border-radius:15px}
.modal{position:fixed;inset:0;z-index:80;background:#100c1deb;display:flex;justify-content:center;align-items:center;padding:12px}.modal img{max-width:100%;max-height:88vh;object-fit:contain;border-radius:9px;background:#fff}.modal button{position:absolute;top:calc(15px + env(safe-area-inset-top));right:14px;background:#fff;color:#3b2c59;border:0;border-radius:100px;width:43px;height:43px;font-size:27px;font-weight:700}
.confetti{pointer-events:none;position:fixed;top:-20px;width:10px;height:20px;z-index:99;animation:fall var(--dur,3s) linear forwards}
.flash{position:fixed;inset:0;z-index:92;pointer-events:none;animation:flash .7s ease-out forwards;background:#fff6c9}
.shake{animation:shake .48s both}
@keyframes float{0%,100%{transform:translateY(1px)}50%{transform:translateY(-7px)}}@keyframes bob{from{transform:rotate(-4deg) translateY(-3px)}to{transform:rotate(4deg) translateY(3px)}}@keyframes fall{to{top:115vh;transform:translate(var(--drift,35px),0) rotate(var(--turn,720deg));opacity:.7}}@keyframes flash{0%{opacity:.85}100%{opacity:0}}@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@media(max-width:430px){#app{padding:10px 12px 28px}.card{padding:20px 16px;border-radius:22px}.masthead{margin:7px 5px 14px}.mascotArea .speech{right:-5px;max-width:119px;font-size:10px}.choice{font-size:12px;min-height:64px;padding:10px 8px;gap:6px}.choice .key{flex-basis:23px;width:23px;height:23px}.photoFrame img{max-height:385px}.photoFrame.group img{max-height:340px}.photoFrame.portrait img{max-height:375px}.btngrid .btn{font-size:12px;padding:10px 8px}}
@media(max-width:350px){.choices{grid-template-columns:1fr}.mascotArea .speech{top:7px}.photoFrame img{max-height:325px}}
@media(prefers-reduced-motion:reduce){.mascot,.resultMascot{animation:none!important}.confetti,.flash,.shake{animation:none!important}}
</style>

share(){const message=`${state.name}のネットミーム古参度は「${RANKS[state.score]}」！ ${state.score}/5問正解 👾 ${location.href.split('#')[0]}`;if(navigator.share){navigator.share({title:'ネットミーム人物名鑑',text:message}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(message).then(()=>alert('結果をコピーしたよ♡')).catch(()=>alert(message))}else alert(message)}
};
function home(){base(`<p class="eyebrow">QUIZ ABOUT INTERNET LEGENDS ♡</p><h1 class="heroTitle">ネットミーム<br><em>人物名鑑</em></h1><p class="subtitle">この顔、見覚えあるよね？<br>写真を見て、名前を当てる超マニアックな5問。<br>あなたの古参度を容赦なく判定します。</p><div class="mascotArea"><span class="sparkle">✦</span><img class="mascot" src="${ASSETS.mascot4}" alt="くるくる髪の手描き案内キャラ"><div class="speech">5問とも<br>知ってるよね？♡</div><span class="sparkle second">✧</span></div><label class="label" for="nickname">♡ まずはニックネームを入力</label><input id="nickname" class="nameInput" maxlength="24" autocomplete="nickname" placeholder="例：古参インターネット民" value="${escapeHTML(state.name)}"><div class="err" id="nameErr" aria-live="polite"></div>${button('クイズ開始！ ✨','start')}${button('🏆 ランキングを見る','board','ghost')}<div class="chips"><span class="chip">📸 写真で5問</span><span class="chip">🧠 4択</span><span class="chip">🎉 派手なランク発表</span></div><p class="note">一度選んだ答えは、最後にまとめて採点されます。</p>`);document.getElementById('nickname').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)ACTIONS.start()});attach()}
function quiz(){const q=QUESTIONS[state.idx],n=state.idx+1;const klass=state.idx===2?'group':(state.idx===1||state.idx===4?'portrait':'');base(`<div class="topline"><span class="user">♡ ${escapeHTML(state.name)} さん</span><span class="qnum">QUESTION ${n} / 5</span></div><div class="bar">${QUESTIONS.map((_,i)=>`<span class="${i<n-1?'done':i===n-1?'now':''}"></span>`).join('')}</div><div class="prompt">WHO IS THIS? ✦</div><h2 class="questionTitle">${escapeHTML(q.question)}</h2><div class="photoFrame ${klass}"><img id="quizPhoto" src="${ASSETS[q.image]}" alt="第${n}問の出題画像。タップで拡大できます。"><span class="zoomHint">🔍 タップで拡大</span></div><p class="questionSide">${escapeHTML(q.accent)}</p><div class="choices">${q.options.map((name,i)=>`<button type="button" class="choice" data-choice="${i}" aria-pressed="false"><span class="key">${'ABCD'[i]}</span><span>${escapeHTML(name)}</span></button>`).join('')}</div><div id="answerErr" class="err" role="status"></div>${button(n===5?'運命の結果発表へ！ 🎉':'次の問題へ ✦','next')}<p class="note">正解は最後まで秘密♡</p>`);app.querySelectorAll('[data-choice]').forEach(e=>e.addEventListener('click',()=>{state.answer=Number(e.dataset.choice);app.querySelectorAll('[data-choice]').forEach(x=>{const sel=x===e;x.classList.toggle('selected',sel);x.setAttribute('aria-pressed',sel?'true':'false')});document.getElementById('answerErr').textContent=''}));document.getElementById('quizPhoto').addEventListener('click',()=>zoom(ASSETS[q.image]));attach()}
function zoom(src){let old=document.querySelector('.modal');if(old)old.remove();const m=document.createElement('div');m.className='modal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label','画像を拡大');const img=document.createElement('img');img.src=src;img.alt='問題の拡大画像';const close=document.createElement('button');close.textContent='×';close.setAttribute('aria-label','閉じる');close.onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};m.append(img,close);document.body.append(m);close.focus();let h=e=>{if(e.key==='Escape'){m.remove();document.removeEventListener('keydown',h)}};document.addEventListener('keydown',h)}
function finish(){state.score=state.answers.reduce((a,choice,i)=>a+(choice===QUESTIONS[i].correct?1:0),0);const id=globalThis.crypto?.randomUUID?.()||String(Date.now());state.resultId=id;setBoard({id,name:state.name,score:state.score,timestamp:Date.now()});state.page='result';render();celebrate()}
function result(){const s=state.score;base(`<div class="resultHeader"><p class="resultSmall">✦ ${escapeHTML(state.name)} さんのネット古参度は… ✦</p><h1 class="resultRank">${RANKS[s]}</h1><p class="score">${s}<span> / 5問正解</span></p><img class="resultMascot" src="${ASSETS['mascot'+AVATARS[s]]}" alt="くるくる髪の案内キャラのリアクション"><div class="taunt">${MESSAGES[s]}</div></div>${button('📣 結果をシェア','share')}<h3 class="sectionTitle">📖 正解＆振り返り</h3><div class="review">${QUESTIONS.map((q,i)=>{const good=state.answers[i]===q.correct;return `<div class="reviewItem ${good?'':'incorrect'}"><div class="reviewTop"><span class="mark ${good?'':'no'}">${good?'○':'×'}</span><span>Q${i+1}　${escapeHTML(q.question)}</span></div><p class="answer"><strong>正解：</strong>${escapeHTML(q.options[q.correct])}</p><p class="answer"><strong>あなた：</strong>${escapeHTML(q.options[state.answers[i]]||'未回答')}　${good?'🎉':'💦'}</p><p class="explain">${escapeHTML(q.detail)}</p></div>`}).join('')}</div><div class="btngrid">${button('もう一度遊ぶ','restart','secondary')}${button('🏆 ランキング','board','secondary')}</div>`);attach()}
function board(){const list=state.board.slice(0,100);base(`<p class="eyebrow">LEGENDS RANKING</p><h1 class="boardHead">🏆 ランキング</h1><p class="boardSub">高得点順。同点は先に回答した人が上位。</p><span class="localBadge">この端末だけのランキング</span><div style="margin-top:22px">${list.length?list.map((x,i)=>`<div class="rowboard ${x.id===state.resultId?'me':''}"><span class="rankIcon">${['🥇','🥈','🥉'][i]||i+1}</span><div class="boardName">${escapeHTML(x.name)}${x.id===state.resultId?'（あなた）':''}<div class="boardTier">${RANKS[Math.max(0,Math.min(5,x.score))]}</div></div><div class="boardScore">${x.score}<small> / 5</small></div></div>`).join(''):'<p class="empty">まだ誰も挑戦していないよ。<br>初代チャンピオンになろう♡</p>'}</div><div style="margin-top:24px">${button('← 戻る','back','secondary')}</div>`);attach()}
function celebrate(){if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;const flash=document.createElement('div');flash.className='flash';document.body.append(flash);setTimeout(()=>flash.remove(),800);document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),600);const colors=['#e76bb3','#9264e0','#ffe17e','#73d7c2','#ffffff'];for(let i=0;i<75;i++){const el=document.createElement('i');el.className='confetti';el.style.left=Math.random()*100+'%';el.style.backgroundColor=colors[i%colors.length];el.style.borderRadius=i%3?'3px':'50%';el.style.setProperty('--dur',(2.1+Math.random()*2.2)+'s');el.style.setProperty('--drift',((Math.random()-.5)*400)+'px');el.style.setProperty('--turn',((Math.random()-.5)*1500)+'deg');el.style.animationDelay=(Math.random()*.6)+'s';document.body.append(el);setTimeout(()=>el.remove(),5600)}}
function render(){document.title='ネットミーム人物名鑑 ♡ 古参度チェック';switch(state.page){case'home':home();break;case'quiz':quiz();break;case'result':result();break;case'board':board();break;default:home()}}
render();
})();
</script>
</body>
</html>
