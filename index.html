<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7df">
<title>ちいかわ検定｜セイレーン編</title>
<style>
:root{--ink:#27231f;--paper:#fffdf5;--line:#e9ddc8;--yellow:#ffe58e;--pink:#ff988c;--good:#2f9b74;--bad:#d95c62}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:radial-gradient(circle at 12% 0,#fff 0,transparent 30%),linear-gradient(#fff7df,#fffdf7 55%,#f5efe4);min-height:100vh}
button{font:inherit}.wrap{width:min(760px,100%);margin:auto;padding:18px 14px 48px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;font-weight:900}.badge{padding:7px 11px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font-size:12px}.card{background:rgba(255,253,245,.97);border:1.5px solid var(--line);border-radius:26px;box-shadow:0 18px 48px #493d2b1c;overflow:hidden}.pad{padding:26px 20px}.center{text-align:center}h1{font-size:clamp(30px,7vw,48px);line-height:1.12;margin:8px 0 12px}p{line-height:1.75}.sub{max-width:570px;margin:0 auto;color:#6a6257;font-weight:650}.warning{max-width:540px;margin:18px auto 0;padding:10px 13px;border-radius:14px;background:#fff0ec;color:#984a42;font-size:13px;font-weight:850}.mascotRow{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:20px 0}.mascot{width:112px;height:94px;object-fit:cover;border-radius:23px;border:3px solid #292929;background:#fff;transform:rotate(-2deg)}.bubble{position:relative;max-width:390px;text-align:left;background:#fff;border:2px solid #292929;padding:12px 14px;border-radius:18px;font-weight:900;line-height:1.45;min-height:52px;display:flex;align-items:center}.bubble:before{content:"";position:absolute;left:-10px;bottom:18px;width:18px;height:18px;background:#fff;border-left:2px solid #292929;border-bottom:2px solid #292929;transform:rotate(45deg)}.cta,.subbtn{width:100%;border-radius:18px;padding:15px 17px;font-weight:950;cursor:pointer}.cta{border:0;background:#292929;color:white;box-shadow:0 7px 0 #0002}.subbtn{border:2px solid #292929;background:white;color:#292929}.hidden{display:none!important}.quiz{padding:20px}.meta{display:flex;justify-content:space-between;gap:10px;font-weight:900}.bar{height:10px;background:#eee5d6;border-radius:99px;overflow:hidden;margin:12px 0 22px}.fill{height:100%;width:20%;background:linear-gradient(90deg,var(--pink),#ffbd69);transition:.3s}.question{font-size:clamp(21px,5vw,30px);line-height:1.45;margin:0 0 18px;font-weight:950}.choices{display:grid;gap:11px}.choice{width:100%;text-align:left;padding:14px 15px;border:2px solid #ddd2c0;border-radius:17px;background:#fff;color:var(--ink);font-weight:850;line-height:1.45;cursor:pointer}.choice.correct{background:#e8f7f0;border-color:var(--good);color:#1b7355}.choice.wrong{background:#ffebeb;border-color:var(--bad);color:#9d3d44}.choice:disabled{cursor:default}.feedback{display:none;margin-top:18px;padding:15px;border-radius:17px;background:#f6f0e5;line-height:1.7;font-weight:720}.feedback.show{display:block}.next{display:none;margin-top:14px}.next.show{display:block}.result{padding:28px 20px;text-align:center}.score{font-size:70px;line-height:1;font-weight:1000;margin:12px 0 8px}.rank{display:inline-block;padding:9px 14px;border-radius:999px;background:var(--yellow);border:2px solid #dfbb49;font-weight:1000;font-size:18px}.desc{max-width:540px;margin:12px auto 20px;color:#655d52;font-weight:700}.rankTable{margin:20px 0;text-align:left;border:1.5px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}.rankRow{display:flex;justify-content:space-between;gap:12px;padding:11px 13px;border-bottom:1px solid #eee5d7;font-size:14px}.rankRow:last-child{border-bottom:0}.actions{display:grid;gap:10px}.footer{text-align:center;color:#8a8073;font-size:12px;line-height:1.7;margin-top:16px}@media(max-width:520px){.wrap{padding:12px 12px 36px}.pad,.result{padding:22px 16px}.quiz{padding:18px 16px}.mascot{width:94px;height:80px}.bubble{font-size:14px}.score{font-size:60px}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div>ちいかわ検定</div><div class="badge">セイレーン編・全5問</div></div>
<section id="start" class="card pad center">
<div class="badge" style="display:inline-block;background:#fff1b9">難易度：だんだん鬼</div>
<h1>人魚の島のひみつ<br>セイレーン編クイズ</h1>
<p class="sub">最初はウォーミングアップ。後半は伏線や物語の核心まで出題します。<strong>5問すべて正解で「ちいかわマスター」！</strong></p>
<div class="mascotRow"><img class="mascot" src="mascot.svg" alt="手描きのクイズ案内キャラクター"><div class="bubble">5問だけだよ？ まさか緊張してるの？</div></div>
<button class="cta" id="startBtn">検定スタート</button>
<div class="warning">⚠️ 原作・映画「人魚の島のひみつ／セイレーン編」の重要なネタバレを含みます。</div>
</section>
<section id="quiz" class="card quiz hidden">
<div class="meta"><span id="qnum"></span><span id="diff"></span></div><div class="bar"><div class="fill" id="fill"></div></div>
<div class="mascotRow" style="justify-content:flex-start;margin:0 0 18px"><img class="mascot" style="width:82px;height:70px" src="mascot.svg" alt=""><div class="bubble" id="taunt"></div></div>
<h2 class="question" id="question"></h2><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><button class="cta next" id="nextBtn">次の問題へ</button>
</section>
<section id="result" class="card result hidden">
<div class="mascotRow"><img class="mascot" src="mascot.svg" alt=""><div class="bubble" id="resultBubble"></div></div>
<div class="score"><span id="score">0</span><span style="font-size:.42em"> / 5</span></div><div class="rank" id="rank"></div><p class="desc" id="rankDesc"></p>
<div class="rankTable">
<div class="rankRow"><span>5問正解</span><b>ちいかわマスター</b></div><div class="rankRow"><span>4問正解</span><b>セイレーン編・上級討伐者</b></div><div class="rankRow"><span>3問正解</span><b>島二郎の常連</b></div><div class="rankRow"><span>2問正解</span><b>島合宿メンバー</b></div><div class="rankRow"><span>1問正解</span><b>チラシに釣られた初心者</b></div><div class="rankRow"><span>0問正解</span><b>まだ船に乗れてない</b></div>
</div>
<div class="actions"><button class="cta" id="shareBtn">結果を友だちに送る</button><button class="subbtn" id="restartBtn">もう一度挑戦</button></div>
</section>
<p class="footer">ファン制作の非公式クイズです。『ちいかわ』および関連作品の公式サイトではありません。</p>
</main>
<script>
const qs=[
{q:"島への招待チラシに書かれていた討伐の報酬は、通常の何倍？",c:["10倍","50倍","100倍","1000倍"],a:2,d:"★☆☆☆☆",t:"これはサービス問題でしょ？",ok:"へぇ〜…これはわかるんだ？",ng:"え？ こんなのもわからないの？",e:"正解は「100倍」。破格の報酬と島限定グルメに惹かれて、みんなは島へ向かいます。"},
{q:"島で店を営み、ちいかわたちを助ける頼れる人物の名前は？",c:["島太郎","島二郎","海二郎","島三郎"],a:1,d:"★★☆☆☆",t:"名前くらい覚えてるよね？",ok:"まあ、ここまではね。",ng:"あれれ？ あの人の名前、忘れたの？",e:"正解は「島二郎」。料理をふるまうだけでなく、セイレーンとの戦いでも頼もしさを見せます。"},
{q:"セイレーンが不思議な歌の力で自由自在に操るものは？",c:["波","ツタ","岩","砂"],a:1,d:"★★★☆☆",t:"ここから“ちゃんと見てたか”が出るよ？",ok:"おっ。ちゃんと覚えてるじゃん。",ng:"歌ってたの、ただのBGMだと思ってた？",e:"正解は「ツタ」。セイレーンは歌の力でツタを操って獲物を捕らえます。"},
{q:"『伝説の生物図鑑』には、人魚の肉を食べるとどうなると書かれていた？",c:["空を飛べる","永遠のいのちが手に入る","セイレーンの歌が聞こえなくなる","海の中で息ができる"],a:1,d:"★★★★☆",t:"ここ、物語の核心だよ？ 覚えてる？",ok:"そこまで覚えてるの、やるじゃん。",ng:"えっ…そこが重要なのに？",e:"正解は「永遠のいのちが手に入る」。人魚をめぐる事件の真相につながる重要な記述です。"},
{q:"島のお出迎えの歌で、「たこやき・すきやき・ケバブ・てりてりソースのやきそば」の頭文字をつなげると？",c:["にげて","たすけて","かえって","みつけて"],a:1,d:"★★★★★",t:"最終問題。これわかったら…ちょっと認める。",ok:"……正解。ちょっと悔しい。",ng:"そこまで見抜けなかったか〜。惜しいね？",e:"正解は「たすけて」。明るい歓迎ムードの裏に仕込まれた、不穏なSOSのような伏線です。"}
];
const ranks={5:["ちいかわマスター","全問正解！ 細かい伏線まで把握している本物クラス。","……全問正解？ ちいかわマスターじゃん。"],4:["セイレーン編・上級討伐者","あと1問！ かなり読み込んでます。マスター目前。","4問？ くやしいけど、かなり強い。"],3:["島二郎の常連","物語の大筋はしっかり把握。島二郎の店なら顔パス級。","半分超えたね。まあまあじゃん？"],2:["島合宿メンバー","島にはちゃんと上陸済み。でも核心部分はもう一度復習！","2問か〜。島観光で満足してない？"],1:["チラシに釣られた初心者","まずは島への招待チラシから復習。次はもっと取れるはず！","1問……？ まさかグルメだけ見てた？"],0:["まだ船に乗れてない","今回は全滅。でもここからがスタート。読み返して再挑戦！","0問！？ え、まだ島にも着いてないの？"]};
let i=0,score=0,locked=false;const $=id=>document.getElementById(id);
function show(id){["start","quiz","result"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden")}
function render(){locked=false;const q=qs[i];$("qnum").textContent=`Q${i+1} / ${qs.length}`;$("diff").textContent=q.d;$("fill").style.width=`${(i+1)/qs.length*100}%`;$("taunt").textContent=q.t;$("question").textContent=q.q;$("feedback").className="feedback";$("nextBtn").className="cta next";$("choices").innerHTML="";q.c.forEach((x,n)=>{const b=document.createElement("button");b.className="choice";b.textContent=`${String.fromCharCode(65+n)}. ${x}`;b.onclick=()=>answer(n,b);$("choices").appendChild(b)})}
function answer(n,b){if(locked)return;locked=true;const q=qs[i];[...document.querySelectorAll(".choice")].forEach((x,k)=>{x.disabled=true;if(k===q.a)x.classList.add("correct")});const ok=n===q.a;if(ok)score++;else b.classList.add("wrong");$("taunt").textContent=ok?q.ok:q.ng;$("feedback").innerHTML=`<strong>${ok?"正解！":"不正解…"}</strong><br>${q.e}`;$("feedback").classList.add("show");$("nextBtn").textContent=i===qs.length-1?"結果を見る":"次の問題へ";$("nextBtn").classList.add("show")}
function result(){const r=ranks[score];$("score").textContent=score;$("rank").textContent=r[0];$("rankDesc").textContent=r[1];$("resultBubble").textContent=r[2];show("result")}
$("startBtn").onclick=()=>{i=0;score=0;show("quiz");render()};$("nextBtn").onclick=()=>{if(i<qs.length-1){i++;render()}else result()};$("restartBtn").onclick=()=>{i=0;score=0;show("quiz");render()};
$("shareBtn").onclick=async()=>{const r=ranks[score];const text=`ちいかわ検定【セイレーン編】で ${score}/5 問正解！\n階級：${r[0]}\nあなたも挑戦してみて！`;if(navigator.share){try{await navigator.share({title:"ちいかわ検定｜セイレーン編",text,url:location.href});return}catch(e){}}try{await navigator.clipboard.writeText(`${text}\n${location.href}`);alert("結果とURLをコピーしました！")}catch(e){prompt("この結果をコピーして送ってね",`${text}\n${location.href}`)}};
</script>
</body></html>
